<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234F46E5'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProTrack — Plan Smarter. Track Progress. Deliver Better.</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script>
    // Prevent theme flash before React mounts
    (function () {
      try {
        const stored = localStorage.getItem('protrack_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
    <!-- Razorpay Payment Gateway SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body
  class="bg-[#F5F7FB] dark:bg-[#0B1120] text-[#172033] dark:text-[#F3F4F6] font-sans antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-150">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
