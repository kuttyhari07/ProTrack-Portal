<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- ProTrack Official Brand Favicon & Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />
  <link rel="shortcut icon" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProTrack — Plan Smarter. Track Progress. Deliver Better.</title>
  
  <!-- Open Graph / Meta -->
  <meta property="og:title" content="ProTrack — Plan Smarter. Track Progress. Deliver Better." />
  <meta property="og:description" content="Production-grade SaaS platform for agile project tracking, automated deadline alerts, and AI copilot." />
  <meta property="og:image" content="/logo.png" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script>
    // Prevent theme flash before React mounts
    (function () {
      try {
        const stored = localStorage.getItem('protrack_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
  <!-- Razorpay Payment Gateway SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body
  class="bg-[#F5F7FB] dark:bg-[#0B1120] text-[#172033] dark:text-[#F3F4F6] font-sans antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-150">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
